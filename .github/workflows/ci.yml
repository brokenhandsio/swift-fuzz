name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly. The 6.4 job tracks a nightly snapshot, so toolchain drift breaks
    # this repo without anyone touching it.
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'Linux' && 'ubuntu-latest' || 'macos-26' }}
    container: ${{ matrix.os == 'Linux' && 'swift:6.3' || null }}
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, macOS]
    steps:
      - uses: actions/checkout@v7
      # Nothing here fuzzes, so this runs on Xcode's toolchain too — which is
      # the point: the library and the templates must compile for people who
      # cannot fuzz locally.
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # Each example is fuzzed for real and asserted on. These are the claims the
  # README makes, so they are the ones worth pinning.
  examples:
    name: ${{ matrix.shape }} example (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: Paired
            swift: "6.3"
            image: swift:6.3
            path: Examples/BuggyLibrary/Fuzzing
          - shape: Paired
            swift: "6.4"
            image: swiftlang/swift:nightly-6.4.x-noble
            path: Examples/BuggyLibrary/Fuzzing
          # The standalone shape needs 6.4; the 6.3 case is covered by the
          # `guard` job below, which asserts it refuses cleanly.
          - shape: Standalone
            swift: "6.4"
            image: swiftlang/swift:nightly-6.4.x-noble
            path: Examples/StandaloneFuzzing
    steps:
      - uses: actions/checkout@v7

      - name: Record seed count
        id: seeds
        working-directory: ${{ matrix.path }}
        run: echo "count=$(find Seeds/BuggyParse -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Fuzz the planted bug
        working-directory: ${{ matrix.path }}
        run: |
          set +e
          swift package --allow-writing-to-package-directory \
            fuzz BuggyParse --time 90 > fuzz.log 2>&1
          status=$?
          set -e

          # A crash is the expected outcome here, so all three properties are
          # asserted explicitly rather than inferred from the exit status.
          if ! grep -q "Fatal error: planted bug" fuzz.log; then
            echo "::error::the planted bug was not found in 90s"
            tail -40 fuzz.log
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::a crash did not propagate a non-zero exit status"
            exit 1
          fi
          if [ -z "$(ls -A Crashes/BuggyParse 2>/dev/null)" ]; then
            echo "::error::crashed but wrote no artefact; --reproduce would be impossible"
            exit 1
          fi
          echo "found the planted bug, exit $status, artefact written"

      # Seeds are passed to libFuzzer after the corpus, which is what makes them
      # read-only. If that ordering regresses, discoveries start landing in
      # Seeds/ and minimization can delete curated inputs.
      - name: Seeds must be untouched
        working-directory: ${{ matrix.path }}
        run: |
          after=$(find Seeds/BuggyParse -type f | wc -l)
          before=${{ steps.seeds.outputs.count }}
          if [ "$after" -ne "$before" ]; then
            echo "::error::Seeds/ changed during a run: $before -> $after"
            exit 1
          fi
          if [ -z "$(ls -A Corpus/BuggyParse 2>/dev/null)" ]; then
            echo "::error::no discoveries were written to Corpus/"
            exit 1
          fi

      # Minimization must shrink the corpus without touching seeds. Getting
      # this wrong deletes curated inputs, which is the failure the Seeds/
      # split exists to prevent.
      - name: Minimize the corpus
        working-directory: ${{ matrix.path }}
        run: |
          before=$(find Corpus/BuggyParse -type f | wc -l)
          swift package --allow-writing-to-package-directory fuzz BuggyParse --minimize-corpus
          after=$(find Corpus/BuggyParse -type f | wc -l)
          seeds=$(find Seeds/BuggyParse -type f | wc -l)
          echo "corpus $before -> $after, seeds $seeds"
          if [ "$after" -gt "$before" ]; then
            echo "::error::minimizing grew the corpus"
            exit 1
          fi
          if [ "$after" -eq 0 ]; then
            echo "::error::minimizing emptied the corpus"
            exit 1
          fi
          if [ "$seeds" -ne "${{ steps.seeds.outputs.count }}" ]; then
            echo "::error::minimizing modified Seeds/"
            exit 1
          fi

      # Two targets share one executable in the paired example. Selecting one by
      # name only works if the plugin asks the built binary what it registers.
      - name: Several targets in one executable
        if: matrix.shape == 'Paired'
        working-directory: ${{ matrix.path }}
        run: |
          swift package --allow-writing-to-package-directory fuzz --list | tee targets.log
          for name in BuggyParse Forwards Backwards; do
            grep -qE "^  $name$" targets.log || { echo "::error::--list omitted $name"; exit 1; }
          done

          set +e
          swift package --allow-writing-to-package-directory fuzz Forwards --time 60 > multi.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || ! grep -q "Fatal error: planted bug" multi.log; then
            echo "::error::selecting a target inside a differently-named executable failed"
            tail -30 multi.log
            exit 1
          fi
          test -d Corpus/Forwards && test -n "$(ls -A Crashes/Forwards)"
          rm -rf Crashes/Forwards

      - name: Replay must be clean once the crash is removed
        working-directory: ${{ matrix.path }}
        run: |
          rm -rf Crashes/BuggyParse
          swift package --allow-writing-to-package-directory fuzz BuggyParse --replay

      - name: Upload fuzzing log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log-${{ matrix.shape }}-${{ matrix.swift }}
          path: ${{ matrix.path }}/fuzz.log
          if-no-files-found: ignore

  # The standalone shape cannot work on 6.3.x. It must say so, rather than
  # failing with an undefined-symbol link error nobody can act on.
  guard:
    name: Standalone refuses on Swift 6.3
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Expect a clear refusal
        working-directory: Examples/StandaloneFuzzing
        run: |
          set +e
          swift package --allow-writing-to-package-directory \
            fuzz BuggyParse --time 5 > guard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::expected the build to fail on this toolchain"
            exit 1
          fi
          if ! grep -q "requires Swift 6.4 or later" guard.log; then
            echo "::error::failed, but not with the explanatory message"
            tail -40 guard.log
            exit 1
          fi
          echo "refused with the expected guidance"

  # The preflight probe must reject a toolchain that cannot fuzz, with guidance
  # rather than a linker error. Linux is the interesting case: it accepts
  # `-sanitize=fuzzer` at compile time and only fails at link, so a probe that
  # merely compiled would pass here and the failure would surface much later.
  preflight:
    name: Preflight rejects a toolchain without libFuzzer
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Remove the fuzzer runtime from this container
        run: find / -name 'libclang_rt.fuzzer*' -delete

      - name: Expect guidance, not a raw linker error
        working-directory: Examples/BuggyLibrary/Fuzzing
        run: |
          set +e
          swift package --allow-writing-to-package-directory \
            fuzz BuggyParse --time 5 > preflight.log 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::expected a failure on a toolchain with no libFuzzer"
            exit 1
          fi
          if ! grep -q "does not include the libFuzzer runtime" preflight.log; then
            echo "::error::failed without the installation guidance"
            tail -30 preflight.log
            exit 1
          fi
          if grep -qE "libclang_rt|undefined reference|unsupported option" preflight.log; then
            echo "::error::a raw toolchain error leaked through to the user"
            grep -nE "libclang_rt|undefined reference|unsupported option" preflight.log | head -5
            exit 1
          fi
          echo "rejected cleanly with installation guidance"

  # fuzz-init has to produce something that actually builds. Scaffolding that
  # emits a plausible-looking but non-compiling target is worse than none.
  scaffold:
    name: fuzz-init produces a working target
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scaffold a target
        working-directory: Examples/BuggyLibrary/Fuzzing
        run: |
          swift package --allow-writing-to-package-directory fuzz-init Scaffolded | tee init.log
          test -f FuzzTargets/Scaffolded/Scaffolded.swift
          test -f FuzzTargets/ScaffoldedShim/shim.c
          test -d Seeds/Scaffolded
          grep -q "ScaffoldedTarget" init.log

      # The stub is written to compile and run untouched, so a new target can be
      # exercised before the harness is filled in.
      # The stub is written to compile and run untouched, so a new target can
      # be exercised before the harness is filled in.
      - name: The untouched stub must build and run
        working-directory: Examples/BuggyLibrary/Fuzzing
        run: |
          # Drop the manifest's trailing "    ]" and ")" and re-close it around
          # the new target. Simpler and less brittle than editing in place.
          head -n -2 Package.swift > Package.swift.new
          cat >> Package.swift.new <<'STANZA'
                  .executableTarget(
                      name: "Scaffolded",
                      dependencies: ["ScaffoldedTarget"],
                      path: "FuzzTargets/ScaffoldedShim"
                  ),
                  .target(
                      name: "ScaffoldedTarget",
                      dependencies: [.product(name: "Fuzzing", package: "swift-fuzz")],
                      path: "FuzzTargets/Scaffolded",
                      plugins: [.plugin(name: "FuzzTargetPlugin", package: "swift-fuzz")]
                  ),
              ]
          )
          STANZA
          mv Package.swift.new Package.swift
          swift package --allow-writing-to-package-directory fuzz Scaffolded --time 20

      - name: Refuses to overwrite an existing target
        working-directory: Examples/BuggyLibrary/Fuzzing
        run: |
          set +e
          swift package --allow-writing-to-package-directory fuzz-init Scaffolded > again.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::fuzz-init overwrote an existing target"
            exit 1
          fi
          grep -q "already exists" again.log

  docs:
    name: DocC archive
    runs-on: ubuntu-latest
    container: swift:6.3
    env:
      SWIFT_FUZZ_DOCC: "1" # wires up the (otherwise-gated) swift-docc-plugin
    steps:
      - uses: actions/checkout@v7
      - name: Build documentation archive
        run: swift package generate-documentation --target Fuzzing --warnings-as-errors
      - name: Package archive
        # DocC output contains files with ':' in their names, which
        # upload-artifact rejects. Tar it into a single file first.
        run: tar -C .build/plugins/Swift-DocC/outputs -czf Fuzzing.doccarchive.tgz Fuzzing.doccarchive
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Fuzzing-doccarchive
          path: Fuzzing.doccarchive.tgz
